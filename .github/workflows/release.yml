name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Run integrity validator
        run: python tools/validate_kit.py

      - name: Run test suite
        run: python tools/test_kit.py

      - name: Extract tag version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG entry
        run: |
          python - <<'EOF'
          import re
          text = open("CHANGELOG.md").read()
          # Match the first versioned section
          m = re.search(r"## \[[\d.]+\].*?\n(.*?)(?=\n## \[|$)", text, re.DOTALL)
          body = m.group(1).strip() if m else "See CHANGELOG.md for details."
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(body + "\n")
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "${{ steps.version.outputs.tag }}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "agents-maker ${{ steps.version.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            $prerelease
